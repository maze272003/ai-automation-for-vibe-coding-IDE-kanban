name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.17.0
          cache: npm
      - run: npm ci
      - run: npm run check:pins
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
